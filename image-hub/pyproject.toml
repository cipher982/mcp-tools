[project]
name = "image-hub"
version = "0.1.0"
description = "Lightweight MCP facade for Gemini image generation via Vertex AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "google-genai>=1.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
image-hub = "image_hub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_hub"]
