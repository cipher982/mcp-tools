[project]
name = "search-hub"
version = "0.1.0"
description = "Lightweight MCP facade for OpenAI web search - reduces 5.2k tokens to <300"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "openai>=1.0.0",
]

[project.scripts]
search-hub = "search_hub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["search_hub"]
