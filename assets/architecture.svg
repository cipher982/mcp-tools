<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="100%" style="stop-color:#c89b6b"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#89b4fa"/>
      <stop offset="100%" style="stop-color:#74a8f7"/>
    </linearGradient>
    <linearGradient id="upstreamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a6e3a1"/>
      <stop offset="100%" style="stop-color:#94d990"/>
    </linearGradient>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c7086"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="url(#bgGrad3)" rx="12"/>

  <!-- Title -->
  <text x="350" y="30" font-family="system-ui, sans-serif" font-size="16" fill="#cdd6f4" text-anchor="middle" font-weight="600">Architecture</text>

  <!-- Claude Code Box -->
  <rect x="260" y="50" width="180" height="50" rx="8" fill="url(#claudeGrad)" opacity="0.9"/>
  <text x="350" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#1e1e2e" text-anchor="middle" font-weight="600">Claude Code</text>

  <!-- Arrow down to hubs -->
  <line x1="300" y1="100" x2="200" y2="140" stroke="#6c7086" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="100" x2="500" y2="140" stroke="#6c7086" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Browser Hub Box -->
  <rect x="80" y="145" width="180" height="50" rx="8" fill="url(#hubGrad)" opacity="0.9"/>
  <text x="170" y="167" font-family="system-ui, sans-serif" font-size="12" fill="#1e1e2e" text-anchor="middle" font-weight="600">browser-hub</text>
  <text x="170" y="183" font-family="monospace" font-size="10" fill="#1e1e2e" text-anchor="middle" opacity="0.8">2 tools / ~300 tokens</text>

  <!-- Search Hub Box -->
  <rect x="420" y="145" width="180" height="50" rx="8" fill="url(#hubGrad)" opacity="0.9"/>
  <text x="510" y="167" font-family="system-ui, sans-serif" font-size="12" fill="#1e1e2e" text-anchor="middle" font-weight="600">search-hub</text>
  <text x="510" y="183" font-family="monospace" font-size="10" fill="#1e1e2e" text-anchor="middle" opacity="0.8">1 tool / ~300 tokens</text>

  <!-- Arrow down to upstream -->
  <line x1="170" y1="195" x2="170" y2="225" stroke="#6c7086" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="195" x2="510" y2="225" stroke="#6c7086" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Connection labels -->
  <text x="115" y="215" font-family="system-ui, sans-serif" font-size="9" fill="#6c7086">Persistent MCP</text>
  <text x="470" y="215" font-family="system-ui, sans-serif" font-size="9" fill="#6c7086">Direct API</text>

  <!-- Upstream Services -->
  <rect x="80" y="230" width="180" height="50" rx="8" fill="url(#upstreamGrad)" opacity="0.9"/>
  <text x="170" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#1e1e2e" text-anchor="middle" font-weight="600">Playwright MCP</text>
  <text x="170" y="268" font-family="monospace" font-size="10" fill="#1e1e2e" text-anchor="middle" opacity="0.8">20+ tools / ~13k tokens</text>

  <rect x="420" y="230" width="180" height="50" rx="8" fill="url(#upstreamGrad)" opacity="0.9"/>
  <text x="510" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#1e1e2e" text-anchor="middle" font-weight="600">OpenAI Responses API</text>
  <text x="510" y="268" font-family="monospace" font-size="10" fill="#1e1e2e" text-anchor="middle" opacity="0.8">gpt-5.2 + web_search</text>

  <!-- Savings callout -->
  <rect x="250" y="290" width="200" height="24" rx="12" fill="#a6e3a1" opacity="0.15"/>
  <text x="350" y="307" font-family="system-ui, sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle" font-weight="600">Facade Pattern = Massive Token Savings</text>
</svg>
