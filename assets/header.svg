<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)" rx="12"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="40" r="80" fill="#e94560" opacity="0.1"/>
  <circle cx="100" cy="160" r="60" fill="#4facfe" opacity="0.1"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>

  <!-- Hub icon -->
  <g transform="translate(60, 60)">
    <!-- Central hub -->
    <circle cx="40" cy="40" r="25" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="12" fill="url(#accentGrad)"/>

    <!-- Spokes -->
    <line x1="40" y1="15" x2="40" y2="-10" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="27" x2="82" y2="12" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="65" y1="40" x2="90" y2="40" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="53" x2="82" y2="68" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="65" x2="40" y2="90" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="53" x2="-2" y2="68" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="40" x2="-10" y2="40" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="27" x2="-2" y2="12" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Outer dots -->
    <circle cx="40" cy="-10" r="4" fill="url(#blueGrad)"/>
    <circle cx="82" cy="12" r="4" fill="url(#blueGrad)"/>
    <circle cx="90" cy="40" r="4" fill="url(#blueGrad)"/>
    <circle cx="82" cy="68" r="4" fill="url(#blueGrad)"/>
    <circle cx="40" cy="90" r="4" fill="url(#blueGrad)"/>
    <circle cx="-2" cy="68" r="4" fill="url(#blueGrad)"/>
    <circle cx="-10" cy="40" r="4" fill="url(#blueGrad)"/>
    <circle cx="-2" cy="12" r="4" fill="url(#blueGrad)"/>
  </g>

  <!-- Title -->
  <text x="180" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#fff">MCP Tools</text>

  <!-- Subtitle -->
  <text x="180" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#a0a0a0">Lightweight MCP facades for Claude Code</text>

  <!-- Stats badges -->
  <g transform="translate(180, 140)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#e94560" opacity="0.2"/>
    <text x="45" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#e94560" text-anchor="middle" font-weight="600">97% fewer tokens</text>
  </g>
  <g transform="translate(280, 140)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#4facfe" opacity="0.2"/>
    <text x="50" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#4facfe" text-anchor="middle" font-weight="600">2 tools per hub</text>
  </g>
  <g transform="translate(390, 140)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#00f2fe" opacity="0.2"/>
    <text x="45" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#00f2fe" text-anchor="middle" font-weight="600">Zero config</text>
  </g>
</svg>
