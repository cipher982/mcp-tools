[project]
name = "browser-hub"
version = "0.1.0"
description = "Lightweight MCP facade for Playwright - reduces 20+ tools to 2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.scripts]
browser-hub = "browser_hub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_hub"]
