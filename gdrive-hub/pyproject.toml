[project]
name = "gdrive-hub"
version = "0.1.0"
description = "Lightweight MCP facade for Google Drive Shared Drives with service account auth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
]

[project.scripts]
gdrive-hub = "gdrive_hub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdrive_hub"]
