[project]
name = "agent-mesh"
version = "0.1.0"
description = "Headless CLI runners for Claude, Codex, and Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agent-mesh = "agent_mesh.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_mesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
