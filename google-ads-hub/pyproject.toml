[project]
name = "google-ads-hub"
version = "0.1.0"
description = "Read-only Google Ads MCP server for agentic analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "google-ads>=25.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
google-ads-hub = "google_ads_hub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["google_ads_hub"]
